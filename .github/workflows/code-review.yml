name: code-review

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  kmp-ios:
    name: kmp-ios
    runs-on: macOS-latest
    # Only run build in template repo
    # if: github.event.repository.name == 'KMP-App-Template-Native' && github.repository_owner == 'Kotlin'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set Xcode version
        shell: bash
        run: |
          set -euo pipefail

          echo "Current developer dir:"
          xcode-select -p || true

          echo "Installed Xcode apps under /Applications:"
          ls -1 /Applications | grep -E '^Xcode.*\.app$' || true

          # Prefer a specific version if present, otherwise pick the newest Xcode*.app
          if [ -d /Applications/Xcode_15.3.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            XCODE_APP="$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "${XCODE_APP}" ] && [ -d "${XCODE_APP}/Contents/Developer" ]; then
              sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
            else
              echo "No Xcode found under /Applications"
              exit 1
            fi
          fi

          echo "Selected developer dir:"
          xcode-select -p
          xcodebuild -version

      - name: iOS debug build
        shell: bash
        run: |
          set -euo pipefail
          cd iosApp

          echo "Xcode:"
          xcodebuild -version

          echo "Listing schemes (diagnostics):"
          if [ -f "iosApp.xcworkspace/contents.xcworkspacedata" ]; then
            xcodebuild -list -workspace iosApp.xcworkspace | cat
            BUILD_CONTAINER=(-workspace iosApp.xcworkspace)
          elif [ -f "iosApp.xcodeproj/project.pbxproj" ]; then
            xcodebuild -list -project iosApp.xcodeproj | cat
            BUILD_CONTAINER=(-project iosApp.xcodeproj)
          else
            echo "No .xcworkspace or .xcodeproj found under iosApp/"
            ls -la | cat
            exit 1
          fi

          echo "Show destinations (diagnostics):"
          xcodebuild "${BUILD_CONTAINER[@]}" -scheme iosApp -showdestinations | cat || true

          # Use a generic iOS Simulator destination to avoid device-name mismatches in CI.
          DEST="generic/platform=iOS Simulator"
          echo "Using destination: ${DEST}"

          xcodebuild \
            "${BUILD_CONTAINER[@]}" \
            -scheme iosApp \
            -configuration Debug \
            -destination "${DEST}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios.app
          path: '**/Build/Products/Debug-iphonesimulator/*.app'


  kmp-android:
    runs-on: macOS-latest
    # Only run build in template repo
    # if: github.event.repository.name == 'kmp' && github.repository_owner == 'Kotlin'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Kmp Android debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  kmp-desktop:
    runs-on: macOS-latest
    # Only run build in template repo
    # if: github.event.repository.name == 'kmp' && github.repository_owner == 'Kotlin'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Kmp Desktop debug build
        run: ./gradlew assembleDebug --stacktrace
#      - name: Upload App
#        uses: actions/upload-artifact@v4
#        with:
#          name: kmp-desktop.apk
#          path: app/build/outputs/apk/debug/app-debug.apk

  kmp-wasmJs:
    runs-on: ubuntu-latest
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "✅ Checkout code"
        uses: actions/checkout@v4
      - name: "⚙️ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: "🛠️ Build WasmJS App"
        run: gradle :app:wasmJsBrowserDistribution
      - name: "📄 Configure GitHub Pages"
        uses: actions/configure-pages@v5
      - name: "📤 Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/build/dist/wasmJs/productionExecutable
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
